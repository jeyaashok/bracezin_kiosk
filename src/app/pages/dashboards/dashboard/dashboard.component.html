<div class="row">
  <div class="col-12">

    <!-- Page Header -->
    <div class="row mb-3 pb-1">
      <div class="col-7 col-lg-7 col-md-7 col-sm-12">
        <div class="d-flex align-items-lg-center flex-lg-row flex-column">
          <div class="flex-grow-1">
            <h4 class="fs-16 mb-1">{{ greetingText | titlecase }}, {{ welcomeText | titlecase }} <span>👋</span></h4>
            <p class="text-muted mb-0">Here's what's happening with your business today.</p>
            <p class="text-muted mb-0">Today: {{ today | date:'dd MMM yyyy' }}</p>
          </div>
        </div>
      </div>
      <div class="col-5 col-lg-5 col-md-5 col-sm-12">
        <div class="flex-shrink-0">
          <div class="grid w-100 gap-2 d-flex flex-wrap align-items-center">

            <div class="d-flex w-100 flex-wrap justify-content-end align-items-center gap-1">
              @for(range of ['To Day','This Week','This Month','This Year','Custom']; track $index){
              <button type="button" class="btn btn-xs shadow-none text-nowrap fs-9"
                [ngClass]="selectedDateRange === range ? 'btn-primary' : 'btn-soft-secondary'"
                (click)="setDateRange(range)">
                {{ range | titlecase }}
              </button>
              }
            </div>

            @if (selectedDateRange === 'Custom') {
            <div class="d-flex w-100 flex-wrap justify-content-end align-items-center gap-1">
              <div>
                <div class="input-group input-group-sm">
                  <input class="form-control flatpickr-input form-xs" type="text" mwlFlatpickr [altInput]="true"
                    [convertModelValue]="true" mode="range" altFormat="d M, Y" dateFormat="d M, Y"
                    placeholder="Select Date Range" [(ngModel)]="customDateRange"
                    (ngModelChange)="onCustomDateRangeChange($event)" readonly>
                </div>
              </div>

              <!-- <input type="date" class="form-control form-control-sm" [value]="customStartDate"
                (change)="setCustomStartDate($any($event.target).value)" aria-label="Custom range start date">
              <span class="text-muted fs-11">to</span>
              <input type="date" class="form-control form-control-sm" [value]="customEndDate"
                (change)="setCustomEndDate($any($event.target).value)" aria-label="Custom range end date"> -->
            </div>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Stat Cards -->
    <app-dashboard-count [dashboard]="dashboard"></app-dashboard-count>

    <div class="row">
      <!-- Recent Activities -->
      <div class="col-xl-4">
        <app-dashboard-recent-activities [dashboard]="dashboard"></app-dashboard-recent-activities>
      </div>

      <!-- Sales Overview -->
      <div class="col-xl-5">
        <app-dashboard-sales-chart [dashboard]="dashboard"></app-dashboard-sales-chart>
      </div>

      <!-- Quick Actions -->
      <div class="col-xl-3">
        <app-dashboard-quick-action></app-dashboard-quick-action>
      </div>
    </div>

    <div class="row">
      <!-- Sales Chart -->
      <div class="col-xl-6">
        <app-dashboard-saleorder-chart [dashboard]="dashboard"></app-dashboard-saleorder-chart>
      </div>

      <!-- Pending Quotations -->
      <div class="col-xl-6">
        <app-dashboard-purchaseorder-chart [dashboard]="dashboard"></app-dashboard-purchaseorder-chart>
      </div>
    </div>

    <div class="row">
      <!-- Recent Enquiries -->
      <div class="col-xl-6">
        <app-dashboard-recent-enquiries [dashboard]="dashboard"></app-dashboard-recent-enquiries>
      </div>

      <!-- Pending Quotations -->
      <div class="col-xl-6">
        <app-dashboard-recent-request-for-quotation
          [dashboard]="dashboard"></app-dashboard-recent-request-for-quotation>
      </div>
    </div>

  </div>
</div>
