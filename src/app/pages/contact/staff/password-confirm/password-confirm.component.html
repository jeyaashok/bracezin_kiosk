<div class="p-4">
  <h5 class="mb-3">Change Password</h5>
  <p class="text-muted mb-3">Please enter New password to Change.</p>

  <div class="form-group mb-2">
    <div class="input-group">
      <input [type]="showPassword ? 'text' : 'password'" class="form-control" placeholder="Enter new password"
        [formControl]="passwordControl" (keyup.enter)="confirm()" autofocus />
      <button type="button" class="btn btn-outline-secondary" (click)="togglePasswordVisibility()">
        <i [class]="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
      </button>
    </div>
    @if(passwordControl.touched && passwordControl.invalid) {
    <div class="text-danger fs-7 mt-1">Password is required.</div>
    }
    @if(errorMessage) {
    <div class="text-danger fs-7 mt-1">{{ errorMessage }}</div>
    }
  </div>

  <div class="d-flex justify-content-end gap-2 mt-4">
    <button class="btn btn-light" (click)="cancel()">Cancel</button>
    <button class="btn btn-primary" (click)="confirm()"
      [disabled]="passwordControl.invalid || !passwordControl.dirty">Confirm</button>
  </div>
</div>
