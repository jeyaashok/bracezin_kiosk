<div class="card">
  <div class="card-header">
    <div class="d-flex">
      <h6 class="card-title flex-grow-1 mb-0 fs-12 fw-bold">{{ title | titlecase }}
        {{ user?.type || 'User' | titlecase }}</h6>
      <div class="flex-shrink-0 d-flex align-items-center gap-2">
        <span class="badge bg-info text-white fs-10 fw-bold"
          aria-label="Outstanding Amount">{{ user?.commission_ratio || 0 | number:'1.2-2' }}%</span>
        <span class="text-primary fw-bold fs-6"
          aria-label="Outstanding Amount">{{ user?.walletBalance || 0 | currency:'USD':'symbol':'1.3-3' }}</span>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ul class="list-unstyled mb-0 vstack gap-2">
      <li>
        <div class="d-flex align-items-center mb-2">
          <div class="flex-shrink-0">
            <ngx-avatars [name]="user.name" [src]="user.imageUrl" size="40" initialsSize="2" textSizeRatio="5"
              [round]="true"></ngx-avatars>
          </div>
          <div class="flex-grow-1 ms-3">
            <h6 class="fs-12 fw-bold mb-1">{{ user?.name | titlecase }}</h6>
            <p class="text-muted mb-0" *ngIf="user?.mobile">{{ user?.mobile }}</p>
            <p class="text-muted mb-0" *ngIf="user?.email">{{ user?.email | lowercase }}</p>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
